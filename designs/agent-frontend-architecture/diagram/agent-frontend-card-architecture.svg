<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent 前端动态卡片接入架构</title>
  <desc id="desc">展示前端页面采集要素、Agent 返回标识、静态资源部署单元加载运行、最终渲染卡片或无界弹窗的流程。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif;
        letter-spacing: 0;
      }
      .title { fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 12px; font-weight: 400; }
      .region-label { font-size: 12px; font-weight: 700; }
      .component-name { fill: #f8fafc; font-size: 15px; font-weight: 700; }
      .component-sub { fill: #94a3b8; font-size: 11px; font-weight: 400; }
      .step { fill: #cbd5e1; font-size: 10px; font-weight: 700; }
      .arrow-label { font-size: 10px; font-weight: 600; }
      .note { fill: #94a3b8; font-size: 10px; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#0f172a"/>
  <rect width="1280" height="760" fill="url(#grid)"/>

  <text x="52" y="54" class="title">Agent 前端动态卡片接入架构</text>
  <text x="52" y="78" class="subtitle">前端采集要素 → Agent 处理与返回标识 → 自动加载静态资源 → 在对话框或全局页面渲染组件</text>

  <rect x="48" y="112" width="240" height="480" rx="16" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="10,5"/>
  <text x="68" y="138" fill="#22d3ee" class="region-label">宿主前端页面</text>

  <rect x="362" y="112" width="260" height="480" rx="16" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="10,5"/>
  <text x="382" y="138" fill="#34d399" class="region-label">Agent 中台处理域</text>

  <rect x="696" y="112" width="250" height="480" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="10,5"/>
  <text x="716" y="138" fill="#fbbf24" class="region-label">静态资源部署单元</text>

  <rect x="1018" y="112" width="214" height="480" rx="16" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="10,5"/>
  <text x="1038" y="138" fill="#a78bfa" class="region-label">组件渲染出口</text>

  <path d="M 288 286 L 362 286" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>
  <text x="325" y="264" text-anchor="middle" fill="#22d3ee" class="arrow-label">1. 要素信息</text>

  <path d="M 492 392 L 492 450 L 250 450 L 250 392" fill="none" stroke="#34d399" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-green)"/>
  <text x="360" y="470" text-anchor="middle" fill="#34d399" class="arrow-label">2. 处理结果 + 标识</text>

  <path d="M 622 286 L 696 286" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text x="659" y="264" text-anchor="middle" fill="#fbbf24" class="arrow-label">3. 加载资源</text>

  <path d="M 946 286 L 1018 286" fill="none" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text x="982" y="264" text-anchor="middle" fill="#c4b5fd" class="arrow-label">4. 运行渲染</text>

  <path d="M 862 404 L 1005 522" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>
  <text x="915" y="458" text-anchor="middle" fill="#fb7185" class="arrow-label">无界弹窗</text>

  <rect x="78" y="202" width="180" height="76" rx="8" fill="#0f172a" filter="url(#softShadow)"/>
  <rect x="78" y="202" width="180" height="76" rx="8" fill="rgba(8, 51, 68, 0.42)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="168" y="232" text-anchor="middle" class="component-name">前端页面</text>
  <text x="168" y="253" text-anchor="middle" class="component-sub">用户上下文 / 页面元素</text>

  <rect x="78" y="326" width="180" height="78" rx="8" fill="#0f172a"/>
  <rect x="78" y="326" width="180" height="78" rx="8" fill="rgba(8, 51, 68, 0.34)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="168" y="356" text-anchor="middle" class="component-name">要素采集器</text>
  <text x="168" y="378" text-anchor="middle" class="component-sub">抽取并组装请求载荷</text>

  <rect x="404" y="202" width="176" height="76" rx="8" fill="#0f172a" filter="url(#softShadow)"/>
  <rect x="404" y="202" width="176" height="76" rx="8" fill="rgba(6, 78, 59, 0.42)" stroke="#34d399" stroke-width="1.5"/>
  <text x="492" y="232" text-anchor="middle" class="component-name">Agent 编排器</text>
  <text x="492" y="253" text-anchor="middle" class="component-sub">理解意图 / 调用能力</text>

  <rect x="404" y="326" width="176" height="78" rx="8" fill="#0f172a"/>
  <rect x="404" y="326" width="176" height="78" rx="8" fill="rgba(6, 78, 59, 0.34)" stroke="#34d399" stroke-width="1.5"/>
  <text x="492" y="356" text-anchor="middle" class="component-name">结果标识</text>
  <text x="492" y="378" text-anchor="middle" class="component-sub">componentId / renderType</text>

  <rect x="734" y="190" width="174" height="84" rx="8" fill="#0f172a" filter="url(#softShadow)"/>
  <rect x="734" y="190" width="174" height="84" rx="8" fill="rgba(120, 53, 15, 0.35)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="821" y="222" text-anchor="middle" class="component-name">资源清单</text>
  <text x="821" y="244" text-anchor="middle" class="component-sub">JS / CSS / manifest</text>

  <rect x="734" y="326" width="174" height="96" rx="8" fill="#0f172a"/>
  <rect x="734" y="326" width="174" height="96" rx="8" fill="rgba(120, 53, 15, 0.28)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="821" y="358" text-anchor="middle" class="component-name">运行时加载</text>
  <text x="821" y="380" text-anchor="middle" class="component-sub">Agent 自动请求并执行</text>
  <text x="821" y="398" text-anchor="middle" class="component-sub">隔离挂载组件</text>

  <rect x="1048" y="178" width="150" height="76" rx="8" fill="#0f172a" filter="url(#softShadow)"/>
  <rect x="1048" y="178" width="150" height="76" rx="8" fill="rgba(76, 29, 149, 0.38)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1123" y="208" text-anchor="middle" class="component-name">单卡片</text>
  <text x="1123" y="229" text-anchor="middle" class="component-sub">Agent 对话框内</text>

  <rect x="1048" y="302" width="150" height="86" rx="8" fill="#0f172a"/>
  <rect x="1048" y="302" width="150" height="86" rx="8" fill="rgba(76, 29, 149, 0.32)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1123" y="334" text-anchor="middle" class="component-name">多卡片组</text>
  <text x="1123" y="356" text-anchor="middle" class="component-sub">列表 / 横滑 / 分组</text>

  <rect x="1048" y="448" width="150" height="96" rx="8" fill="#0f172a"/>
  <rect x="1048" y="448" width="150" height="96" rx="8" fill="rgba(136, 19, 55, 0.34)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1123" y="480" text-anchor="middle" class="component-name">无界弹窗</text>
  <text x="1123" y="502" text-anchor="middle" class="component-sub">弹出到页面全局</text>

  <g transform="translate(70 632)">
    <text x="0" y="0" class="step">关键契约</text>
    <rect x="0" y="18" width="1110" height="70" rx="10" fill="rgba(15,23,42,0.86)" stroke="#334155" stroke-width="1"/>
    <text x="22" y="48" class="note">Agent 返回的标识决定资源包与渲染形态：单卡片、多卡片、弹窗。</text>
    <text x="22" y="70" class="note">静态资源独立部署；Agent 负责按标识加载、请求、运行，并把前端组件挂载到目标容器。</text>
    <circle cx="768" cy="52" r="6" fill="#22d3ee"/>
    <text x="784" y="56" class="note">前端输入</text>
    <circle cx="884" cy="52" r="6" fill="#34d399"/>
    <text x="900" y="56" class="note">Agent 处理</text>
    <circle cx="1010" cy="52" r="6" fill="#fbbf24"/>
    <text x="1026" y="56" class="note">资源运行</text>
  </g>
</svg>
